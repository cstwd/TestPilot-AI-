<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><g font-family="Microsoft YaHei,Arial,sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0d1824"/><text x="62" y="62" fill="#6cdedf" font-size="22" font-weight="700">GitHub Actions</text><text x="62" y="143" fill="#eff7fe" font-size="44" font-weight="700">两次冷启动失败后，第三轮托管验证通过</text><rect x="62" y="177" width="1156" height="2" fill="#315267"/><rect x="62" y="207" width="266" height="66" fill="#20394b"/><text x="81" y="250" fill="#6cdedf" font-size="23" font-weight="700">检出固定提交</text><text x="354" y="250" fill="#eff7fe" font-size="24" font-weight="400">Windows runner 安装依赖，并记录环境和 Git SHA。</text><rect x="62" y="291" width="266" height="66" fill="#20394b"/><text x="81" y="334" fill="#6cdedf" font-size="23" font-weight="700">冻结评测</text><text x="354" y="334" fill="#eff7fe" font-size="24" font-weight="400">复算 120 轮历史数据；负向输入应返回非零退出码。</text><rect x="62" y="375" width="266" height="66" fill="#20394b"/><text x="81" y="418" fill="#6cdedf" font-size="23" font-weight="700">独立评分</text><text x="354" y="418" fill="#eff7fe" font-size="24" font-weight="400">运行 8 项 Demo Lab 评分检查。</text><rect x="62" y="459" width="266" height="66" fill="#20394b"/><text x="81" y="502" fill="#6cdedf" font-size="23" font-weight="700">WASI 预热与回归</text><text x="354" y="502" fill="#eff7fe" font-size="24" font-weight="400">预热固定解释器后，168 项 Pytest 与 3 项 Node 测试通过。</text><rect x="62" y="543" width="266" height="66" fill="#20394b"/><text x="81" y="586" fill="#6cdedf" font-size="23" font-weight="700">上传工件</text><text x="354" y="586" fill="#eff7fe" font-size="24" font-weight="400">保存环境、原始测试输出、JUnit 与离线评测 JSON。</text><text x="62" y="674" fill="#91b0c5" font-size="18" font-weight="400">证据   45992897616  /  000a19c  /  course-verification.yml</text></g></svg>