<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><g font-family="Microsoft YaHei,Arial,sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0d1824"/><text x="62" y="62" fill="#6cdedf" font-size="22" font-weight="700">F13  /  geometry_calculator.area</text><text x="62" y="143" fill="#eff7fe" font-size="44" font-weight="700">抑制一次异常，测试还能发现变化吗？</text><rect x="62" y="177" width="1156" height="2" fill="#315267"/><rect x="62" y="207" width="266" height="66" fill="#20394b"/><text x="81" y="250" fill="#6cdedf" font-size="23" font-weight="700">原版基线</text><text x="354" y="250" fill="#eff7fe" font-size="24" font-weight="400">先在原文件运行同一套件，确认可以比较。</text><rect x="62" y="291" width="266" height="66" fill="#20394b"/><text x="81" y="334" fill="#6cdedf" font-size="23" font-weight="700">产生变异</text><text x="354" y="334" fill="#eff7fe" font-size="24" font-weight="400">第 8 行 SuppressRaise 将 raise ValueError 改为 pass。</text><rect x="62" y="375" width="266" height="66" fill="#20394b"/><text x="81" y="418" fill="#6cdedf" font-size="23" font-weight="700">逐一执行</text><text x="354" y="418" fill="#eff7fe" font-size="24" font-weight="400">每个一阶变异用同一套件在受限运行器独立执行。</text><rect x="62" y="459" width="266" height="66" fill="#20394b"/><text x="81" y="502" fill="#6cdedf" font-size="23" font-weight="700">本轮记录</text><text x="354" y="502" fill="#eff7fe" font-size="24" font-weight="400">2 杀死、1 存活、2 执行错误。第 8 行变异存活。</text><rect x="62" y="543" width="266" height="66" fill="#20394b"/><text x="81" y="586" fill="#6cdedf" font-size="23" font-weight="700">两种分母</text><text x="354" y="586" fill="#eff7fe" font-size="24" font-weight="400">全量 2/5 = 40%；有效 2/3 = 66.67%。</text><text x="62" y="674" fill="#91b0c5" font-size="18" font-weight="400">来源   reports/phase07/f13-geometry.json  /  本地模板测试套件</text></g></svg>