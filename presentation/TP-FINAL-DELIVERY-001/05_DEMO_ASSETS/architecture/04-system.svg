8" height="67" fill="#172A3B"/><text x="302" y="403.26" text-anchor="start" font-size="22" fill="#F2F7FC" font-weight="400" font-family="Microsoft YaHei,sans-serif">analysis 解析 AST；generation 经 model_provider 调用回环 Ollama / Vulkan</text><rect x="56" y="451" width="226" height="67" fill="#20394B"/><text x="70" y="492.42" text-anchor="start" font-size="24" fill="#6CDEDF" font-weight="700" font-family="Microsoft YaHei,sans-serif">受限执行</text><rect x="286" y="451" width="938" height="67" fill="#172A3B"/><text x="302" y="491.26" text-anchor="start" font-size="22" fill="#F2F7FC" font-weight="400" font-family="Microsoft YaHei,sans-serif">runs / mutation_flow → runner → WASI CPython + Pytest</text><rect x="56" y="539" width="226" height="67" fill="#20394B"/><text x="70" y="580.42" text-anchor="start" font-size="24" fill="#6CDEDF" font-weight="700" font-family="Microsoft YaHei,sans-serif">持久化与报告</text><rect x="286" y="539" width="938" height="67" fill="#172A3B"/><text x="302" y="579.26" text-anchor="start" font-size="22" fill="#F2F7FC" font-weight="400" font-family="Microsoft YaHei,sans-serif">SQLite 保存文件、套件、运行和缺陷；quality 读取快照并导出</text></svg>