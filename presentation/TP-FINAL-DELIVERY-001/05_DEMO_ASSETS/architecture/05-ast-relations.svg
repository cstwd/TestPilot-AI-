<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><g font-family="Microsoft YaHei,Arial,sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0d1824"/><text x="62" y="62" fill="#6cdedf" font-size="22" font-weight="700">F02  /  telemetry.py</text><text x="62" y="143" fill="#eff7fe" font-size="44" font-weight="700">从语法树查到方法定义与局部调用</text><rect x="62" y="177" width="1156" height="2" fill="#315267"/><rect x="62" y="207" width="266" height="66" fill="#20394b"/><text x="81" y="250" fill="#6cdedf" font-size="23" font-weight="700">输入</text><text x="354" y="250" fill="#eff7fe" font-size="24" font-weight="400">解析 telemetry.py 的源码文本。</text><rect x="62" y="291" width="266" height="66" fill="#20394b"/><text x="81" y="334" fill="#6cdedf" font-size="23" font-weight="700">类型与方法</text><text x="354" y="334" fill="#eff7fe" font-size="24" font-weight="400">在图谱选择 Sample，再选中 normalized。</text><rect x="62" y="375" width="266" height="66" fill="#20394b"/><text x="81" y="418" fill="#6cdedf" font-size="23" font-weight="700">图谱边</text><text x="354" y="418" fill="#eff7fe" font-size="24" font-weight="400">类包含方法；Inspector 展示源文件第 10–11 行。</text><rect x="62" y="459" width="266" height="66" fill="#20394b"/><text x="81" y="502" fill="#6cdedf" font-size="23" font-weight="700">源码调用</text><text x="354" y="502" fill="#eff7fe" font-size="24" font-weight="400">SignalWindow.average 调用 mean_value(self.readings)。</text><rect x="62" y="543" width="266" height="66" fill="#20394b"/><text x="81" y="586" fill="#6cdedf" font-size="23" font-weight="700">查证</text><text x="354" y="586" fill="#eff7fe" font-size="24" font-weight="400">点击源码检查对应行，分别判断包含关系和实际调用。</text><text x="62" y="674" fill="#91b0c5" font-size="18" font-weight="400">来源   eval/ast_visual/telemetry.py  /  真实 Edge 图谱与源码截图</text></g></svg>